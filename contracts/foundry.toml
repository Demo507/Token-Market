[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# lets Deploy.s.sol write the addresses straight into the frontend
fs_permissions = [{ access = "read-write", path = "../frontend/src" }]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
